name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: mv lib/main.dart /tmp/m.dart
      - run: flutter create --platforms android --org com.example --project-name pro_max_god /tmp/fix
      - run: cp -r /tmp/fix/android.
      - run: mv /tmp/m.dart lib/main.dart
      - run: sed -i 's/, scale: 0.8//g' lib/main.dart
      - run: sed -i 's/scale: 0.8, //g' lib/main.dart
      - run: flutter pub add file_picker video_player path_provider
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Pro-Max-GOD-APK
          path: build/app/outputs/flutter-apk/app-release.apk
