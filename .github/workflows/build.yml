name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Fix Android Folder
        run: |
          mv lib/main.dart /tmp/main.dart
          flutter create --platforms android --project-name pro_max_god --org com.example /tmp/fix
          cp -r /tmp/fix/android .
          mv /tmp/main.dart lib/main.dart
          flutter pub add file_picker video_player path_provider
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Pro-Max-GOD-APK
          path: build/app/outputs/flutter-apk/app-release.apk
